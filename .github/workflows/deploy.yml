name: Deploy Fycheo Maestro
on:
  push:
    branches:
      - main

jobs:
  maestro-deploy:
    name: 🎉 Deploy Maestro
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔑 Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
echo "VITE_DEMO_SUPABASE_URL=${{ secrets.VITE_DEMO_SUPABASE_URL }}" >> .env
          echo "VITE_DEMO_SUPABASE_ANON_KEY=${{ secrets.VITE_DEMO_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> .env
          echo "VITE_GSC_SITE=${{ secrets.VITE_GSC_SITE }}" >> .env
          echo "VITE_GA4_PROPERTY_ID=${{ secrets.VITE_GA4_PROPERTY_ID }}" >> .env

      - name: 🔨 Build Project
        run: npm run build

      - name: 📂 Sync files (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_PASS }}
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_TARGET }}
          protocol: ftps
